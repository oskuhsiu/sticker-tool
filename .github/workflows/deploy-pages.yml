# 把 web/（純靜態網頁版）build 後部署到 GitHub Pages。
# 啟用方式：repo Settings → Pages → Source 選「GitHub Actions」，之後 push master 即自動部署。
name: Deploy web to GitHub Pages

on:
  push:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        working-directory: web
        run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      - name: Deterministic browser contracts
        working-directory: web
        run: npm test
      - name: Build（含 typecheck；@imgly 模型資源一併複製進 dist/imgly）
        working-directory: web
        run: npm run build
      - uses: actions/configure-pages@v5
        with:
          # 首次執行自動啟用 repo 的 GitHub Pages（Source=GitHub Actions），免手動進 Settings
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
