# anim-set 動作庫 —— 一鍵動態圖組的「動作設定」
#
# 這是整個 skill 的核心可重用資產：把每個動作的「逐格分鏡」預先寫死。
# 創作判斷（哪格做什麼姿勢＋什麼表情）做一次、固化在這裡；換新角色只是換 codex 的 -i 參考圖。
# 分鏡設計依據 char-gen/references/method.md 第 5 節動畫原則：
#   緩入緩出（端點相鄰格位置差小、中段大）／預備動作（大動作前先小幅反向）／
#   跟隨（主體停住後髮絲衣襬再晃半格）／表情弧線（漸開→峰值最強→回落，每格都寫表情）。
#
# 每個動作載入時須通過的硬約束（skill 會校驗）：
#   - 5 ≤ frames ≤ 20         （LINE 動態貼圖規格；< 5 會被 validateAnimatedImage 擋）
#   - cols*rows ≥ frames       （grid 要容得下；多出的格 codex 留空即可）
#   - storyboard 長度 === frames（每格都要有分鏡，缺一格 = 死臉/空格）
#   - loops × durationSec ≤ 4   （ANIMATED_SPEC.maxDurationSec；超過會被默默壓速）
#
# v1：12 個高頻、動作弧線清楚、適合循環的精選動作。每個都要在範例六視圖上真跑驗證過弧線，
# 格式與品質確立後再擴張到數十個。

meta:
  version: 1

  # 取六視圖哪個視角當每格基準（master 是多視角 turnaround 時必填，否則 codex 不知對齊哪個）。
  # 可擴充；目前對應常見 turnaround 角度。
  views: [front, three_quarter, side, back]

  # 注入每個 codex prompt 的 TASK/NEGATIVE 共用硬規則（避免逐動作重寫）。
  # skill 組 prompt 時把 {grid}{frames} 換成該動作的值。背景優先序照搬 char-gen 輸出硬規則。
  #
  # 佈局＝單列（1×N）：codex image_gen 有長寬比天花板（~2.3:1 寬），出不了 8:1/16:1 超寬條，
  # 但單列 ≤8 格仍可（實測 8×1 給到 1920×819）。單列只有一條地面 → 腳底基線天生 0px 飄動，
  # 勝過多列 grid（多列要逐列腳底錨定）。≤8 格一律單列；16/20 格才走多列 grid 或補幀。
  outputContract: |
    輸出單一 PNG：一條「橫長條」＝ 1 列 × {frames} 欄（{grid}）＝ {frames} 連續影格，由左到右排列，不是多張獨立檔、不要排成多列。
    背景優先序（照搬、講到死）：
      (A) 第一優先＝真透明 RGBA：背景 alpha 為真正的 0x00（該位置完全沒有像素）；
          整張唯一允許 alpha>0 的只有主體本人＋與他互動／手持的物件；
          格間 gutter、每格主體周圍、每一格的底，一律 0x00。
      (B) 退路＝純綠幕 #00FF00、整張均勻不加陰影，主體＋道具畫在綠幕前，保留綠幕原樣、不要自行去背。
      (C) 絕不：白色卡片底、純色底、棋盤格假透明。
    構圖錨點（協調感來源）：格間留明顯 gutter；主體完整置中、佔格高約 75–80%（舉手/道具仍不出格）；手腳與道具不可越過格線；
      ★最關鍵★所有格主體的「最低處」對齊在同一條水平基線上（站姿＝腳底、坐姿＝臀腿底）——整條圖共用一條地面線，不可有人浮高、有人沉低；
      每格縮放比例、角色身高、頭部大小完全相同（不忽大忽小）；所有格同一鏡頭距離、同一取景、同一光源方向。
    執行規則：只能用內建 image_gen；server error 等幾秒重試（最多 5 次）；
    絕不改用 PIL/SVG/canvas 等程式化繪製；持續失敗就直接回報失敗。

actions:
  # ── 1. 揮手打招呼 ───────────────────────────────────────────────
  - id: wave
    nameZh: 揮手打招呼
    emotion: 開心、友善
    frames: 8
    grid: "8x1"
    view: front
    viewExpressionBase: happy
    loop: true
    durationSec: 1.6
    loops: 2
    storyboard:
      - "雙手自然垂放身側，閉嘴微笑"
      - "右手微離大腿、肩稍沉（預備動作），微笑"
      - "右手抬至胸口高度，笑容張開"
      - "右手抬至耳邊、掌心朝前，開心燦笑（表情峰值）"
      - "手掌向外側小幅擺、頭微歪向同側，維持燦笑"
      - "手掌擺回內側，維持燦笑"
      - "手落回胸口高度，笑容略收"
      - "手回到身側、肩放鬆，閉嘴微笑（與第一格幾乎相同，循環順接）"
    negativeLock:
      - "不要雙手同時舉，只揮右手一隻"
      - "手與手指不可超出格頂格線"

  # ── 2. 點頭稱是 ─────────────────────────────────────────────────
  - id: nod
    nameZh: 點頭稱是
    emotion: 認同、附和
    frames: 6
    grid: "6x1"
    view: three_quarter
    viewExpressionBase: neutral
    loop: true
    durationSec: 1.2
    loops: 3
    storyboard:
      - "頭正中、平視，嘴角微抿（中性起點）"
      - "下巴微抬（預備反向），眉稍揚"
      - "頭明顯下點、視線朝下，嘴角上揚開始微笑"
      - "頭點到最低（峰值），閉眼微笑、認同感最強"
      - "頭回抬、視線回正，維持微笑"
      - "頭回正中位置、平視，微笑略收（順接起點）"
    negativeLock:
      - "只動頭與頸，肩膀與身體保持不動"
      - "不要變成左右搖頭"

  # ── 3. 搖頭拒絕 ─────────────────────────────────────────────────
  - id: shake_head
    nameZh: 搖頭拒絕
    emotion: 無奈、不認同
    frames: 6
    grid: "6x1"
    view: front
    viewExpressionBase: neutral
    loop: true
    durationSec: 1.2
    loops: 3
    storyboard:
      - "頭正中、平視，嘴角平直（中性起點）"
      - "頭微轉向左（預備小幅），眉頭微皺"
      - "頭明顯轉向右、視線隨之，嘴角下撇（無奈）"
      - "頭明顯轉向左、視線隨之，搖頭幅度峰值、輕嘆表情"
      - "頭轉回中央、放慢，無奈苦笑"
      - "頭回正中、平視，嘴角回平（順接起點）"
    negativeLock:
      - "只左右轉頭，不要上下點頭"
      - "肩膀與身體保持不動"

  # ── 4. 大笑 ─────────────────────────────────────────────────────
  - id: laugh
    nameZh: 開懷大笑
    emotion: 開心、爆笑
    frames: 8
    grid: "8x1"
    view: front
    viewExpressionBase: happy
    loop: true
    durationSec: 1.4
    loops: 2
    storyboard:
      - "身體直立、雙手自然垂放，閉嘴淺笑（起點）"
      - "肩稍沉、下巴微收（預備），笑意上揚"
      - "頭微後仰、嘴張開，開始笑"
      - "頭明顯後仰、一手扶肚、嘴大張，放聲大笑（峰值）、瞇眼"
      - "身體前傾回正、肩抖動，持續大笑、眼角帶笑淚花"
      - "頭回正、手仍扶肚，笑聲漸收、開口笑"
      - "肩放鬆、手放下，回到開口微笑"
      - "身體直立、閉嘴淺笑（與起點幾乎相同，循環順接）"
    negativeLock:
      - "笑容誇張但五官仍維持參考圖的臉型與比例"
      - "瞇眼但仍看得出眼睛形狀，不要瞇成兩條線"

  # ── 5. 委屈大哭 ─────────────────────────────────────────────────
  - id: cry
    nameZh: 委屈大哭
    emotion: 委屈、難過
    frames: 8
    grid: "8x1"
    view: front
    viewExpressionBase: sad
    loop: true
    durationSec: 1.6
    loops: 2
    storyboard:
      - "頭微低、雙手垂放，嘴角下撇、眼眶含淚（起點）"
      - "肩聳起、雙手開始抬（預備），眉成八字、淚將落"
      - "雙手抬到臉頰下方，嘴張開、淚珠滑落"
      - "雙手掩住眼睛、頭低下，放聲大哭（峰值）、淚如雨下"
      - "手微張開露出眼、肩抖動，持續哭、抽噎"
      - "手放到臉頰，嘴仍癟、淚減少"
      - "手垂回胸前，吸鼻、眼眶仍紅"
      - "頭微低、手垂放，嘴角下撇含淚（順接起點）"
    negativeLock:
      - "淚珠畫成清楚水滴，不要糊成一片"
      - "掩眼時仍露出部分臉孔，維持角色辨識度"

  # ── 6. 生氣 ─────────────────────────────────────────────────────
  - id: angry
    nameZh: 生氣冒煙
    emotion: 生氣、不滿
    frames: 8
    grid: "8x1"
    view: front
    viewExpressionBase: angry
    loop: true
    durationSec: 1.4
    loops: 2
    storyboard:
      - "雙手自然垂放，眉微皺、嘴抿（起點）"
      - "雙手握拳微抬、肩上提（預備），眉壓低"
      - "雙拳舉到胸側、身體微前傾，瞪眼、嘴角下壓"
      - "雙拳緊握下壓、頭頂冒小怒氣符號（峰值），鼓臉瞪眼、張嘴怒吼"
      - "身體微震、拳維持，怒氣未消、噘嘴瞪視"
      - "肩開始下落、拳鬆開，眉仍皺、嘟嘴"
      - "雙手垂回、深呼一口氣，眉舒緩、餘怒"
      - "雙手垂放、眉微皺嘴抿（順接起點）"
    negativeLock:
      - "怒氣符號小且只在頭頂兩側，不要佔滿格子"
      - "鼓臉但不要漲紅到看不出原本膚色"

  # ── 7. 比愛心 ───────────────────────────────────────────────────
  - id: love
    nameZh: 雙手比愛心
    emotion: 喜歡、甜蜜
    frames: 8
    grid: "8x1"
    view: front
    viewExpressionBase: happy
    loop: true
    durationSec: 1.8
    loops: 2
    storyboard:
      - "雙手自然垂放，閉嘴甜笑（起點）"
      - "雙手抬至胸前、手指微張（預備），臉頰微紅"
      - "雙手在胸前靠近、開始比心，眼睛發亮"
      - "雙手在胸口上方合成一個愛心、頭微歪，甜笑臉紅（峰值）、眨單眼"
      - "愛心舉高一點、身體微傾，維持甜笑、旁邊冒小愛心符號"
      - "愛心放回胸口高度，笑容維持"
      - "雙手張開往下、愛心放開，開心笑"
      - "雙手垂回身側，閉嘴甜笑（順接起點）"
    negativeLock:
      - "愛心由雙手手指合成，不要憑空出現大愛心"
      - "臉頰紅暈淡，不要把整張臉塗紅"

  # ── 8. 比讚 ─────────────────────────────────────────────────────
  - id: thumbs_up
    nameZh: 比讚
    emotion: 得意、肯定
    frames: 6
    grid: "6x1"
    view: three_quarter
    viewExpressionBase: happy
    loop: true
    durationSec: 1.5
    loops: 2
    storyboard:
      - "雙手自然垂放、身體微側，閉嘴自信微笑（起點）"
      - "右手握拳微抬、肩稍沉（預備），瞇眼笑意起"
      - "右手抬到胸前、拇指開始翹起，得意笑"
      - "右手向前送出、拇指完全翹起（峰值），瞇眼得意笑、眨單眼"
      - "手微微往前頓一下定住、髮絲微晃（跟隨），維持得意笑"
      - "手收回胸前高度、笑容略收（下一輪再送出，循環順接）"
    negativeLock:
      - "只翹右手拇指，另一手自然垂放"
      - "拇指形狀清楚、與拳分明，不要黏成一團"

  # ── 9. 加油握拳 ─────────────────────────────────────────────────
  - id: cheer
    nameZh: 加油打氣
    emotion: 振奮、鼓勵
    frames: 8
    grid: "8x1"
    view: front
    viewExpressionBase: happy
    loop: true
    durationSec: 1.4
    loops: 2
    storyboard:
      - "雙手自然垂放，閉嘴堅定微笑（起點）"
      - "雙手握拳收到腰側、微蹲（預備），吸氣張嘴"
      - "身體上挺、雙拳抬到胸前，振奮張嘴"
      - "雙拳用力上舉過頭、踮腳（峰值），張大嘴喊加油、發光眼神"
      - "拳定在最高點微頓、髮絲上揚（跟隨），維持振奮"
      - "雙拳落回胸前、腳跟落地，開口笑"
      - "拳收回腰側、肩放鬆，笑意維持"
      - "雙手垂放、閉嘴堅定微笑（順接起點）"
    negativeLock:
      - "雙拳對稱上舉"
      - "踮腳但腳不可超出格底格線"

  # ── 10. 鼓掌 ────────────────────────────────────────────────────
  - id: clap
    nameZh: 拍手鼓掌
    emotion: 讚賞、開心
    frames: 6
    grid: "6x1"
    view: front
    viewExpressionBase: happy
    loop: true
    durationSec: 1.2
    loops: 3
    storyboard:
      - "雙手在胸前分開約一個手掌寬，開口微笑（起點）"
      - "雙手快速靠近（預備收小），笑意上揚"
      - "雙掌相擊、身體微前傾，開心瞇眼笑（峰值）"
      - "雙手彈開回到分開位置、肩微抖（跟隨），燦笑"
      - "雙手再次靠近，維持燦笑"
      - "雙掌再相擊、隨即回到分開（順接起點，連續鼓掌）"
    negativeLock:
      - "雙手大小對稱、十指清楚"
      - "雙手不要穿模交疊成一團"

  # ── 11. 睡覺 ────────────────────────────────────────────────────
  - id: sleep
    nameZh: 安詳睡覺
    emotion: 想睡、安詳
    frames: 6
    grid: "6x1"
    view: side
    viewExpressionBase: neutral
    loop: true
    durationSec: 1.8
    loops: 2
    # 取側面視角、坐姿趴睡（非全躺），保持構圖偏高，避免動態貼圖「一邊 ≥270」不過。
    storyboard:
      - "側身坐姿、頭枕於交疊的手臂上，閉眼安詳、嘴微抿（起點）"
      - "胸口隨吸氣微微抬起、頭幾乎不動，閉眼安詳，冒出一個小的 Z 符號"
      - "胸口抬到最高、肩微鬆，閉眼、嘴微張，Z 上飄並變大"
      - "胸口隨吐氣回落，閉眼安詳，再冒出一個新的小 Z"
      - "胸口落到最低、頭微沉，閉眼、嘴抿，Z 飄遠變淡"
      - "胸口回到平靜起伏的中點，閉眼安詳（順接起點）"
    negativeLock:
      - "全程閉眼"
      - "Z 符號小且只出現在頭部側上方，不要佔滿格子"

  # ── 12. 問號歪頭 ────────────────────────────────────────────────
  - id: question
    nameZh: 疑惑歪頭
    emotion: 疑惑、不解
    frames: 6
    grid: "6x1"
    view: three_quarter
    viewExpressionBase: surprised
    loop: true
    durationSec: 1.5
    loops: 2
    storyboard:
      - "頭正、平視，眉微挑、嘴微抿（疑惑起點）"
      - "頭開始歪向右、一手抬向下巴（預備），眼神往上飄"
      - "頭歪到右側、手指輕點下巴，頭側冒出問號、困惑皺眉"
      - "頭歪到最大、問號最明顯（峰值），歪嘴、瞪大眼疑惑"
      - "頭回正一些、手仍在下巴，問號變淡、若有所思"
      - "頭回正、手放下，眉微挑嘴抿（順接起點）"
    negativeLock:
      - "問號小且只在頭部側上方，不要佔滿格子"
      - "只歪頭，身體不要整個傾倒"
