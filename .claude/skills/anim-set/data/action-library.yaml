      - "右肘略彎、右手抬離身側約一個拳頭高，嘴角上揚"
      - "右手抬到腰際高度，笑容張開一半"
      - "右手抬到胸口下緣、掌心開始轉向前方，微笑"
      - "右手抬到胸口高度、掌心朝前，笑容張開"
      - "右手抬到肩膀高度，開心笑"
      - "右手抬到耳邊、掌心朝前，開心燦笑（揮手峰值起點）"
      - "右手掌向外側擺到最大、頭微歪向同側，燦笑"
      - "右手掌擺回中位，維持燦笑"
      - "右手掌向內側小幅擺，維持燦笑"
      - "右手掌擺回中位、頭回正，笑容仍滿"
      - "右手降到肩膀高度，笑容略收"
      - "右手降到胸口高度，開口微笑"
      - "右手降到腰際、肩膀放鬆，微笑"
      - "右手回到身側、閉嘴微笑（與第一格幾乎相同，順接循環）"
    negativeLock:
      - "不要雙手同時舉，只揮右手一隻；左手全程自然垂放身側"
      - "手與手指不可超出格頂格線"

