  # ── 11. 睡覺（16 格＝兩個呼吸循環）──────────────────────────────
  - id: sleep
    nameZh: 安詳睡覺
    emotion: 想睡、安詳
    frames: 16
    grid: "8x2"
    view: side
    viewExpressionBase: neutral
    loop: true
    durationSec: 2.0
    loops: 2
    # 取側面視角、坐姿趴睡（非全躺），保持構圖偏高，避免動態貼圖「一邊 ≥270」不過。
    storyboard:
      - "側身坐姿、頭枕於交疊的手臂上，閉眼安詳、嘴微抿（起點）"
      - "胸口隨吸氣微微抬起、頭幾乎不動，閉眼安詳"
