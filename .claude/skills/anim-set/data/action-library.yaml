    view: three_quarter
    viewExpressionBase: neutral
    loop: true
    durationSec: 1.6
    loops: 2
    storyboard:
      - "頭正中、平視，嘴角微抿（中性起點）"
      - "下巴微抬（預備反向），眉稍揚"
      - "頭開始下點、視線下移，嘴角上揚"
      - "頭下點到一半，微笑漸開"
      - "頭點到最低（第一次點頭峰值），閉眼微笑、認同感強"
      - "頭回抬一些、髮絲微晃（跟隨），維持微笑"
      - "頭抬回近正中、視線回正，微笑"
      - "頭微抬（第二次預備），眉再揚"
      - "頭再次下點、視線下移，認同感加強"
      - "頭下點到一半，笑意更濃"
      - "頭點到最低（第二次峰值），閉眼大點頭、認同最強"
      - "頭回抬一些、髮絲微晃（跟隨），微笑"
      - "頭抬回近正中，維持微笑"
      - "頭回到正中、平視，微笑"
      - "微笑略收、頭穩定"
      - "頭正中、平視、嘴角微抿（順接起點）"
    negativeLock:
      - "只動頭與頸，肩膀與身體保持不動"
      - "不要變成左右搖頭"

  # ── 3. 搖頭拒絕（16 格＝左右各兩擺）──────────────────────────────
