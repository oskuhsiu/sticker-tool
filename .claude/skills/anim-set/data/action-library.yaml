      - "胸口再隨吸氣微微抬起，閉眼安詳"
      - "胸口繼續抬起，閉眼，冒出一個新的小 Z"
      - "胸口抬到最高、肩微鬆，閉眼、嘴微張，Z 上飄"
      - "胸口開始回落，閉眼，Z 上飄變大"
      - "胸口回落到中段，閉眼安詳，Z 飄遠"
      - "胸口落到最低、頭微沉，閉眼，Z 飄遠變淡"
      - "胸口回升、頭枕穩定、髮絲微晃（跟隨），閉眼安詳"
      - "胸口回到平靜起伏的中點，閉眼安詳（順接起點）"
    negativeLock:
      - "全程閉眼"
      - "Z 符號小且只出現在頭部側上方，不要佔滿格子"

  # ── 12. 問號歪頭 ────────────────────────────────────────────────
  - id: question
    nameZh: 疑惑歪頭
    emotion: 疑惑、不解
