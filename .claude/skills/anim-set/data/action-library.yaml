# anim-set 動作庫 —— 一鍵動態圖組的「動作設定」
#
# 這是整個 skill 的核心可重用資產：把每個動作的「逐格分鏡」預先寫死。
# 創作判斷（哪格做什麼姿勢＋什麼表情）做一次、固化在這裡；換新角色只是換 codex 的 -i 參考圖。
# 分鏡設計依據 char-gen/references/method.md 第 5 節動畫原則：
#   緩入緩出（端點相鄰格位置差小、中段大）／預備動作（大動作前先小幅反向）／
#   跟隨（主體停住後髮絲衣襬再晃半格）／表情弧線（漸開→峰值最強→回落，每格都寫表情）。
#
# 每個動作載入時須通過的硬約束（skill 會校驗）：
#   - 5 ≤ frames ≤ 20         （LINE 動態貼圖規格；< 5 會被 validateAnimatedImage 擋）
#   - cols*rows ≥ frames       （grid 要容得下；多出的格 codex 留空即可）
#   - storyboard 長度 === frames（每格都要有分鏡，缺一格 = 死臉/空格）
#   - loops × durationSec ≤ 4   （ANIMATED_SPEC.maxDurationSec；超過會被默默壓速）
#
# v1：12 個高頻、動作弧線清楚、適合循環的精選動作。每個都要在範例六視圖上真跑驗證過弧線，
# 格式與品質確立後再擴張到數十個。

meta:
  version: 1

  # 取六視圖哪個視角當每格基準（master 是多視角 turnaround 時必填，否則 codex 不知對齊哪個）。
  # 可擴充；目前對應常見 turnaround 角度。
  views: [front, three_quarter, side, back]

  # 注入每個 codex prompt 的 TASK/NEGATIVE 共用硬規則（避免逐動作重寫）。
  # skill 組 prompt 時把 {grid}{frames} 換成該動作的值。背景優先序照搬 char-gen 輸出硬規則。
  #
  # 佈局＝16 格 / 8×2：codex image_gen 有長寬比天花板（~2.3:1 寬），出不了 8:1/16:1 超寬條，
  # 也出不了 16×1。但 8×2 用直立格時外框約 1920×820（≈2.34:1），跟實測能出的 8×1 同比例 → 不會崩。
  # 兩列＝兩條基線，靠 cells.ts 腳底錨點＋場景精修對齊收（實測 wave 8×2 切完僅 4px 漂移）。
  # 16 格全是 codex 真畫的姿勢 → 動畫最順、零內插鬼影、一次出圖；勝過 8 格再程式補幀（mci 鬼影 / RIFE 要 416MB 依賴）。
  outputContract: |
    輸出單一 PNG：一個「{grid} 網格」（8 欄 × 2 列）＝ {frames} 連續影格，reading order 由左到右、由上到下（第 1 列＝格1～格8 在上、第 2 列＝格9～格16 在下）。不是多張獨立檔。
    整張外框比例約 2.3:1（codex image_gen 出得了的寬上限），每格為直立矩形；整張約 1920×820、每格約 240×400。
    背景優先序（照搬、講到死）：
      (A) 第一優先＝真透明 RGBA：背景 alpha 為真正的 0x00（該位置完全沒有像素）；
          整張唯一允許 alpha>0 的只有主體本人＋與他互動／手持的物件；
          格間 gutter、每格主體周圍、每一格的底，一律 0x00。
      (B) 退路＝純綠幕 #00FF00、整張均勻不加陰影，主體＋道具畫在綠幕前，保留綠幕原樣、不要自行去背。
      (C) 絕不：白色卡片底、純色底、棋盤格假透明。
    構圖錨點（協調感來源）：
      把整張想成同一張方格紙——16 個格子大小完全相同、上下兩列的格高完全相同；
      ★最關鍵（基線）★每一格主體的「最低處」都對齊在「該格底部的同一條相對水平線」上（站姿＝腳底、坐姿＝臀腿底），每格最低處距格底的距離都一樣；
      跨列也要一致：上下兩列的角色縮放、鏡頭距離、取景完全相同，像同一台固定機位相機連拍 {frames} 張，不可有的格大有的小、不可有人浮高有人沉低；
      格與格之間（橫向與縱向）都留明顯 gutter；每格主體完整置中、佔格高約 75–80%（舉手/道具仍不出格）；手腳與道具不可越過格線或圖頂；頭部中心在每格同一相對高度。
    執行規則：只能用內建 image_gen；server error 等幾秒重試（最多 5 次）；
    絕不改用 PIL/SVG/canvas 等程式化繪製；持續失敗就直接回報失敗。

