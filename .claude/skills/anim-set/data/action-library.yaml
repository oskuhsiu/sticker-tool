  # ── 10. 鼓掌（16 格＝連續四擊）──────────────────────────────────
  - id: clap
    nameZh: 拍手鼓掌
    emotion: 讚賞、開心
    frames: 16
    grid: "8x2"
    view: front
    viewExpressionBase: happy
    loop: true
    durationSec: 1.3
    loops: 3
    storyboard:
      - "雙手在胸前分開約一個手掌寬，開口微笑（起點）"
      - "雙手快速靠近（預備收小），笑意上揚"
      - "雙掌相擊、身體微前傾，開心瞇眼笑（第一擊峰值）"
      - "雙手彈開回到分開位置、肩微抖（跟隨），燦笑"
      - "雙手再次靠近，維持燦笑"
      - "雙掌相擊（第二擊），開心瞇眼笑"
      - "雙手彈開、肩微抖，燦笑"
      - "雙手再次靠近，燦笑"
      - "雙掌相擊（第三擊），瞇眼笑"
      - "雙手彈開回分開位置、肩微抖，燦笑"
      - "雙手再次靠近，維持燦笑"
      - "雙掌相擊（第四擊），開心瞇眼笑"
      - "雙手彈開，燦笑"
